<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>My to-do list</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-card">
        <header class="card-header">
            <div class="brand-mark" aria-hidden="true">✓</div>
            <p class="eyebrow">YOUR DAY, IN ORDER</p>
            <h1>My to-do list</h1>
            <p class="intro">Small steps make big things happen.</p>
        </header>

        <section class="task-entry" aria-labelledby="task-label">
            <label id="task-label" for="toDo">Add a task</label>
            <div class="entry-row">
                <input type="text" id="toDo" placeholder="What needs to get done?" autocomplete="off">
                <button type="button" onclick="show()">Add task</button>
            </div>
        </section>

        <section class="task-section" aria-labelledby="tasks-heading">
            <h2 id="tasks-heading">Your tasks</h2>
            <ul id="display"></ul>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
